version: '3.8'
services:
  npb-app-prod:
    image: npb-app-prod
    container_name: npb-app-prod
    # all that is needed to build prod live image
    build:
      context: .
      dockerfile: Dockerfile.prod
      # DATABASE_URL needed for static site generation - getStaticProps
      # NEXTAUTH_URL needed for CustomHead SEO
      args:
        - ARG_DATABASE_URL=$DATABASE_URL
        - ARG_NEXTAUTH_URL=$NEXTAUTH_URL
    ports:
      - '3001:3001'
    #command: sleep infinity
    volumes:
      - ./uploads:/app/uploads
    env_file:
      - ./envs/production-docker/.env.production.docker
      - ./envs/production-docker/.env.production.docker.local
    depends_on:
      - npb-db-prod
    networks:
      - proxy
      - internal-prod

  npb-db-prod:
    image: postgres:14.3-bullseye
    container_name: npb-db-prod
    restart: unless-stopped
    ports:
      - '5432:5432'
    user: '${MY_UID}:${MY_GID}'
    volumes:
      - ./prisma/pg-data:/var/lib/postgresql/data
    # uncomment for external access
    # - ./prisma/pg-config/pg_hba.conf:/etc/postgresql.conf
    # - ./prisma/pg-config/postgresql.conf:/etc/pg_hba.conf
    environment:
      - PGDATA=/var/lib/postgresql/data/data-prod
    env_file:
      - ./envs/production-docker/.env.production.docker.local
    networks:
      - proxy
      - internal-prod

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus-prod
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - '127.0.0.1:9090:9090' # localhost only — not exposed to internet
    networks:
      - internal-prod

  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana-prod
    restart: unless-stopped
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    ports:
      - '127.0.0.1:3002:3000' # localhost only — access via SSH tunnel
    networks:
      - internal-prod
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  proxy:
    external: true
  internal-prod:
    external: false
