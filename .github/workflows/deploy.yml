name: Build, Push and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  build-and-push:
    name: Build Docker image and push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Print commit info
        run: git show -s --format='%h %s'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        id: docker_build
        with:
          context: .
          file: ./Dockerfile.prod
          build-args: |
            ARG_DATABASE_URL=${{ secrets.NPB_DATABASE_URL }}
            ARG_NEXTAUTH_URL=${{ secrets.NPB_NEXTAUTH_URL }}
          push: true
          # tag with both latest and the commit SHA for traceability
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nextjs-prisma-boilerplate:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nextjs-prisma-boilerplate:${{ github.sha }}
          # cache layers to speed up subsequent builds
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nextjs-prisma-boilerplate:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nextjs-prisma-boilerplate:buildcache,mode=max

      - name: Print image digest
        run: echo "Image digest ${{ steps.docker_build.outputs.digest }}"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push # only runs if build-and-push succeeds

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            cd ~/nextjs-prisma-boilerplate

            echo "==> Pulling latest code"
            git pull origin main

            echo "==> Pulling latest image from Docker Hub"
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nextjs-prisma-boilerplate:latest

            echo "==> Stopping current containers"
            docker compose -f docker-compose.prod.yml -p npb-prod down

            echo "==> Starting updated containers"
            export NEXTAUTH_URL=${{ secrets.NPB_NEXTAUTH_URL }}
            export DATABASE_URL=${{ secrets.NPB_DATABASE_URL }}
            docker compose -f docker-compose.prod.yml -p npb-prod up -d

            echo "==> Running database migrations"
            docker exec npb-app-prod npx prisma migrate deploy

            echo "==> Cleaning up old images"
            docker image prune -f

            echo "==> Deployment complete"
            docker ps
