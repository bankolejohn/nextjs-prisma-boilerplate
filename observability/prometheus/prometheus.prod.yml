global:
  scrape_interval: 15s # production: every 15s is sufficient, reduces noise
  evaluation_interval: 15s # how often to evaluate alert rules

# Alert rules files
rule_files:
  - /etc/prometheus/rules/*.yml

# Alertmanager (add when ready)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'nextjs-app'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['npb-app-prod:3001']
    # Label all metrics from this job with env=production
    relabel_configs:
      - target_label: environment
        replacement: production

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
