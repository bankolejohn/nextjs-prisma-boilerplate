groups:
  - name: nextjs-app-alerts
    interval: 30s
    rules:
      # Alert when error rate exceeds 5% over a 5-minute window
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'High HTTP error rate detected'
          description: 'More than 5% of requests are returning 5xx errors over the last 5 minutes.'

      # Alert when p95 latency exceeds 2 seconds
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High request latency detected'
          description: '95th percentile latency is above 2 seconds for route {{ $labels.route }}.'

      # Alert when the app container stops exporting metrics
      - alert: AppDown
        expr: up{job="nextjs-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Application is down'
          description: 'Prometheus cannot reach the /api/metrics endpoint. The app may be down.'

      # Alert when Node.js heap memory exceeds 400MB
      - alert: HighMemoryUsage
        expr: nodejs_heap_size_used_bytes > 400 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High Node.js heap memory usage'
          description: 'Node.js heap is using {{ $value | humanize }}B of memory.'
